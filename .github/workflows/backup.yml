name: backup
on:
  schedule: [{ cron: '17 3 */6 * *' }]   # every 6 days, keeps Supabase awake (<7-day pause)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/backup.mjs
      - run: |
          git config user.name "backup-bot"
          git config user.email "backup@users.noreply.github.com"
          git add backups && git commit -m "chore: data backup" || echo "no changes"
          git push || echo "nothing to push"
